[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerpost"
version = "1.0.0"
description = "Local-first peer-agent message bus"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "peerpost contributors" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
peerpost = "peerpost.cli:main"
peerpostd = "peerpost.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]
